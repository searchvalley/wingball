  /* Layout: full-bleed side-scrolling court at dusk, with 70s sportswear stripes on the type and label-style plates for menus. */
  :root {
    color-scheme: dark;
    --ink: #0c2d33;
    --ink2: #123c44;
    --cream: #fff4d6;
    --muted: #9fb4b4;
    --mustard: #f5b700;
    --orange: #f0641e;
    --red: #e5383b;
    --cyan: #5ad1e8;
    --blacktop: #2a2f3a;
    --common: #9fb4b4;
    --rare: #4aa8ff;
    --epic: #c77dff;
    --legendary: #f5b700;
    --display: "Bowlby One", Impact, "Arial Black", sans-serif;
    --label: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--cream); }
  #stage { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: var(--label); -webkit-tap-highlight-color: transparent; }
  #court { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hudLeft { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #hudCoins { color: var(--mustard); }
  #hudHearts { color: #ff6b81; letter-spacing: .1em; }
  #scorewrap { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #score { font-family: var(--display); font-size: clamp(52px, 11vh, 84px); line-height: 1; text-shadow: 3px 3px 0 var(--orange), 6px 6px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #streak { min-height: 24px; font-weight: 700; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; color: var(--mustard); text-shadow: 0 2px 0 var(--ink); }
  #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-inline: 16px; }
  .chip { padding: 2px 8px; background: var(--ink); border-radius: 3px; font-weight: 700; font-size: 16px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  #tools { position: absolute; z-index: 7; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
  .tool { position: relative; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; background: var(--ink); border: 2px solid var(--cream); border-radius: 50%; touch-action: none; }
  .tool svg { width: 20px; height: 20px; fill: var(--cream); }
  #holdRing { position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; opacity: 0; background: conic-gradient(var(--mustard) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
  #hint { position: absolute; left: 0; right: 0; bottom: 96px; display: flex; justify-content: center; pointer-events: none; }
  #hint span { padding: 6px 14px; background: var(--ink); border-radius: 4px; font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
  #toasts { position: absolute; z-index: 9; left: 0; right: 0; top: 156px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
  .toast { padding: 7px 14px; background: var(--ink); border: 2px solid var(--mustard); border-radius: 4px; font-weight: 700; font-size: 18px; text-align: center; }

  /* Screens */
  .screen { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; box-sizing: border-box; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; overflow-y: auto; }
  .screen.centered { justify-content: safe center; }
  .screen button { pointer-events: auto; }
  #wordmark { margin: 0; padding-right: 12px; font-family: var(--display); font-weight: 400; font-size: clamp(38px, min(13vw, 15vh), 112px); line-height: 1.05; letter-spacing: .01em; text-shadow: 4px 4px 0 var(--mustard), 8px 8px 0 var(--orange), 12px 12px 0 var(--red); }
  #menuTop { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #menuChips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  #menuChips .chip { font-size: 17px; }
  #chipCoins { color: var(--mustard); }
  #chipHearts { color: #ff8fa0; }

  .plate { box-sizing: border-box; width: min(100%, 440px); display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--ink); border: 3px solid var(--cream); border-radius: 6px; box-shadow: 6px 6px 0 var(--orange); pointer-events: auto; }
  .plate h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.05; color: var(--mustard); text-wrap: balance; }
  .plate p { margin: 0; font-weight: 500; font-size: 18px; line-height: 1.25; }
  .cta { padding: 10px 16px; background: var(--orange); color: var(--ink); border: 0; border-radius: 4px; font-family: var(--display); font-size: 22px; letter-spacing: .02em; }
  .cta:hover { background: var(--mustard); }
  .cta:disabled { background: #41585c; color: var(--muted); cursor: not-allowed; }
  .ghost { padding: 8px 10px; background: transparent; color: var(--cream); border: 2px solid var(--cream); border-radius: 4px; font-weight: 700; font-size: 17px; letter-spacing: .03em; }
  .ghost:hover { background: var(--ink2); }
  .ghost:disabled { color: var(--muted); border-color: #41585c; cursor: not-allowed; }
  .ghost[aria-pressed="true"], .ghost[aria-selected="true"] { background: var(--mustard); border-color: var(--mustard); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row > * { flex: 1 1 auto; min-width: 0; }
  #modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #modes .ghost { padding: 6px 2px; font-size: 16px; }
  #modeNote { min-height: 2.5em; font-size: 17px; }
  #nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #nav .ghost { position: relative; font-size: 16px; padding: 7px 2px; }
  #nav .wide { grid-column: 1 / -1; }
  .badge { position: absolute; top: -8px; right: -5px; min-width: 20px; padding: 1px 4px; box-sizing: border-box; background: var(--red); color: var(--cream); border-radius: 10px; font-size: 14px; line-height: 18px; }

  #boxscore { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; font-size: 18px; font-weight: 500; }
  #boxscore dt { text-transform: uppercase; letter-spacing: .08em; font-size: 16px; align-self: center; }
  #boxscore dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  #boxscore .lead { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; }
  #overNote { color: var(--mustard); font-weight: 700; letter-spacing: .03em; }
  #reviveBar { height: 8px; background: var(--ink2); border-radius: 4px; overflow: hidden; }
  #reviveFill { height: 100%; width: 100%; background: var(--mustard); transform-origin: left; }

  /* Panels */
  .panel { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; background: var(--ink); }
  .panelHead { flex: none; display: flex; align-items: center; gap: 12px; padding-block: max(12px, env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 56px); border-bottom: 3px solid var(--orange); }
  .panelHead h2 { margin: 0; flex: 1 1 auto; min-width: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 5vw, 30px); line-height: 1.1; color: var(--mustard); }
  .panelCoins { flex: none; font-weight: 700; font-size: 18px; color: var(--mustard); font-variant-numeric: tabular-nums; }
  .panelBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 12px; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); user-select: text; -webkit-user-select: text; }
  .inner { width: 100%; max-width: 860px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs .ghost { flex: 1 1 70px; min-width: 0; }
  h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--cream); }
  .muted { color: var(--muted); }
  .panelBody p { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 500; }

  /* Shop */
  #shopHero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; }
  #shopPreview { width: 100%; height: 130px; display: block; border-radius: 4px; background: var(--ink2); }
  #shopInfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #shopName { font-family: var(--display); font-size: 20px; line-height: 1.1; overflow-wrap: anywhere; }
  #shopRarity { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; }
  #shopBar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #shopBar select { padding: 7px 8px; background: var(--ink2); border: 2px solid var(--cream); border-radius: 4px; font-weight: 700; font-size: 16px; }
  #shopCount { flex: 1 1 auto; font-weight: 700; font-size: 17px; }
  #shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 6px 4px; background: var(--ink2); border: 2px solid var(--rc, var(--common)); border-radius: 4px; font-size: 14px; font-weight: 700; line-height: 1.12; text-align: center; }
  .item canvas { width: 60px; height: 60px; }
  .item .nm { min-height: 2.24em; overflow-wrap: anywhere; }
  .item .st { color: var(--mustard); font-variant-numeric: tabular-nums; }
  .item.equipped .st { color: var(--cyan); }
  .item .st.req { color: var(--cream); }
  .dlSteps { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 4px; font-size: 18px; font-weight: 500; line-height: 1.3; }
  #dlStatus { min-height: 1.3em; color: var(--mustard); font-weight: 700; }
  #panelInner .cta { align-self: flex-start; }
  .item[aria-pressed="true"] { outline: 3px solid var(--cream); outline-offset: 1px; }
  .item.locked canvas { opacity: .62; }
  #shopPager { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }

  /* Lists */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .quest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 10px; background: var(--ink2); border-radius: 4px; }
  .quest .tx { font-weight: 700; font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
  .quest .pr { grid-column: 1; height: 6px; background: var(--ink); border-radius: 3px; overflow: hidden; }
  .quest .pr i { display: block; height: 100%; background: var(--mustard); }
  .quest .nums { grid-column: 1; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .quest .act { grid-column: 2; grid-row: 1 / span 3; }
  .quest .ghost { font-size: 16px; padding: 6px 10px; white-space: nowrap; }
  .quest .got { color: var(--cyan); font-weight: 700; font-size: 16px; }
  .quest .rw { color: var(--mustard); font-weight: 700; font-size: 16px; white-space: nowrap; }
  #statGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 0; }
  #statGrid div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 10px; background: var(--ink2); border-radius: 4px; }
  #statGrid dt { font-size: 16px; font-weight: 500; }
  #statGrid dd { margin: 0; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

  .lbRow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 7px 10px; background: var(--ink2); border-radius: 4px; font-size: 18px; font-weight: 700; }
  .lbRow.me { outline: 2px solid var(--mustard); }
  .lbRow .rk { color: var(--mustard); font-variant-numeric: tabular-nums; }
  .lbRow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbRow .val { font-variant-numeric: tabular-nums; }
  .tag { margin-left: 6px; padding: 0 5px; border-radius: 3px; background: var(--red); color: var(--cream); font-size: 13px; letter-spacing: .05em; vertical-align: 2px; }
  .tag.bot { background: #41585c; }
  .lbRow .ghost { padding: 2px 8px; font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 16px; flex: 1 1 150px; min-width: 0; }
  .field input { box-sizing: border-box; width: 100%; padding: 8px 10px; background: var(--ink2); border: 2px solid var(--cream); border-radius: 4px; font-size: 18px; font-weight: 500; }
  .formRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .formRow > .ghost { flex: 0 0 auto; }
  .guide { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 10px; align-items: center; }
  .guide canvas { width: 36px; height: 36px; }
  .switchRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--ink2); border-radius: 4px; font-size: 18px; font-weight: 700; }

  .modalWrap { position: absolute; inset: 0; z-index: 8; display: flex; align-items: safe center; justify-content: center; box-sizing: border-box; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(6, 22, 26, .78); overflow-y: auto; }
  #codeInput { font-family: var(--display); font-size: 26px; letter-spacing: .25em; text-align: center; }
  #codeError { color: #ff8fa0; font-weight: 700; min-height: 1.2em; }

  @media (max-height: 560px) {
    #wordmark { font-size: clamp(30px, 12vh, 56px); text-shadow: 2px 2px 0 var(--mustard), 4px 4px 0 var(--orange), 6px 6px 0 var(--red); }
    #menuTop { gap: 6px; }
    .plate { gap: 7px; padding: 10px 14px; width: min(100%, 640px); }
    .plate h2 { font-size: 25px; }
    .plate p { font-size: 16px; }
    #modeNote { min-height: 0; font-size: 15px; }
    .cta { padding: 6px 14px; font-size: 19px; }
    #boxscore { font-size: 16px; grid-template-columns: 1fr auto 1fr auto; }
    #boxscore .lead { font-size: 22px; }
    #overReason { display: none; }
    #toasts { top: 70px; }
    #nav { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    #nav .ghost { font-size: 14px; padding: 5px 1px; }
    #nav .wide { grid-column: auto; }
  }
  @media (max-width: 520px) {
    #shopHero { grid-template-columns: minmax(0, 1fr); }
    #shopPreview { height: 104px; }
  }
</style></head><body><main id="stage">
  <canvas id="court" role="img" aria-label="A winged basketball flying over an outdoor court toward floating hoops"></canvas>

  <div id="hud" hidden>
    <div id="hudLeft">
      <div>Best <span id="bestVal">0</span></div>
      <div id="hudCoins"></div>
      <div id="hudHearts"></div>
    </div>
    <div id="scorewrap">
      <div id="score" aria-live="polite">0</div>
      <div id="streak"></div>
      <div id="chips"></div>
    </div>
  </div>

<script>
/* SIM:START */
const GROUND = 568;

function createSim(seed, options) {
  const opts = Object.assign({ speedMul: 1, coins: true, powerups: true, saves: true, zen: false }, options);
  const G = 1500, FLAP = -430, R = 17, RIM = 4, MAXFALL = 640;
  let s = (seed >>> 0) || 1;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const range = (a, b) => a + (b - a) * rnd();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ramp = n => Math.min(1, n / 40);
  const speedAt = n => (165 + 135 * ramp(n)) * opts.speedMul;
  let untilShield = 4, untilBoost = 8;

  const sim = {
    R, opts, ball: { x: 0, y: 250, vx: speedAt(0), vy: 0, rot: 0, flapT: 9 },
    hoops: [], pickups: [], score: 0, made: 0, misses: 0, streak: 0, bestStreak: 0, swishes: 0, bricks: 0, gold: 0,
    coinsRun: 0, shield: false, follower: false, guardT: 0, magnetT: 0, slowT: 0, doubleT: 0,
    over: null, top: 0, events: [], count: 0, revives: 0,
    flap() {
      if (sim.over) return;
      sim.ball.vy = FLAP; sim.ball.flapT = 0;
      sim.events.push({ type: 'flap' });
    },
    queueHeart() {
      const b = sim.ball, i = sim.hoops.findIndex(h => h.x > b.x + 620);
      if (i < 1) return false;
      const a = sim.hoops[i - 1], z = sim.hoops[i];
      sim.pickups.push({ kind: 'heart', x: (a.x + z.x) / 2, y: clamp((a.base + z.base) / 2 - 70, 70, 470), taken: false });
      return true;
    },
    revive() {
      const b = sim.ball, reason = sim.over;
      sim.over = null; sim.revives++; sim.streak = 0;
      const h = next();
      if (reason === 'airball' || h.x - b.x < 170) skip(h);
      const n = next();
      b.vx = speedAt(sim.made); b.vy = 0;
      b.y = clamp(n.y - 80, sim.top + R + 30, GROUND - 120);
      sim.guardT = Math.max(sim.guardT, 3);
    },
    step
  };

  const next = () => sim.hoops.find(o => !o.scored);
  function skip(h) { h.scored = true; h.skipped = true; }

  function spawn() {
    const n = sim.count++, d = ramp(n), last = sim.hoops[sim.hoops.length - 1];
    const h = { n, rw: 52 - 10 * d, tilt: 0, amp: 0, w: 0, phase: 0, scored: false, touched: false, reversed: false, swish: false, skipped: false, gold: false, sPrev: null, hitT: 0, kick: 0 };
    if (!last) { h.x = 230; h.base = 320; }
    else {
      const maxDy = 70 + 130 * d;
      h.x = last.x + speedAt(n) * (1.95 - .55 * d);
      h.base = clamp(last.base + range(-maxDy, maxDy), 150, 430);
    }
    if (n >= 10) h.tilt = range(-1, 1) * (.12 + .25 * d);
    if (n >= 18 && rnd() < .45) {
      h.amp = 25 + 35 * d; h.w = range(1.2, 2); h.phase = range(0, 6.28);
      h.base = clamp(h.base, 150 + h.amp, 430 - h.amp);
    }
    h.gold = n >= 5 && rnd() < .07;
    h.y = h.base + (h.amp ? h.amp * Math.sin(h.phase) : 0);
    sim.hoops.push(h);
    if (!last) return;
    const my = clamp((last.base + h.base) / 2 - 70, 70, 470);
    if (opts.coins && rnd() < .5) {
      const cx = last.x + (h.x - last.x) * .36;
      for (let i = -1; i <= 1; i++) sim.pickups.push({ kind: 'coin', x: cx + i * 30, y: my - (1 - Math.abs(i)) * 14, taken: false });
    }
    if (opts.powerups) {
      untilShield--; untilBoost--;
      let kind = null;
      if (untilShield <= 0) { kind = 'shield'; untilShield = Math.round(range(5, 9)); }
      else if (untilBoost <= 0) { kind = ['magnet', 'slow', 'double'][Math.floor(rnd() * 3)]; untilBoost = Math.round(range(9, 15)); }
      if (kind) sim.pickups.push({ kind, x: last.x + (h.x - last.x) * .62, y: my, taken: false });
    }
  }

  function rimPoints(h) {
    const c = Math.cos(h.tilt), n = Math.sin(h.tilt);
    return [[h.x - h.rw * c, h.y - h.rw * n], [h.x + h.rw * c, h.y + h.rw * n]];
  }

  function fill() {
    while (!sim.hoops.length || sim.hoops[sim.hoops.length - 1].x < sim.ball.x + 2200) spawn();
    while (sim.hoops[0].x < sim.ball.x - 1400) sim.hoops.shift();
    while (sim.pickups.length && sim.pickups[0].x < sim.ball.x - 1400) sim.pickups.shift();
  }

  function collect() {
    const b = sim.ball;
    for (const p of sim.pickups) {
      if (p.taken) continue;
      const dx = b.x - p.x, dy = b.y - p.y, dist = Math.hypot(dx, dy);
      if (p.kind === 'coin' && sim.magnetT > 0 && dist < 190 && dist > 0) {
        p.x += dx / dist * 7; p.y += dy / dist * 7;
      }
      if (dist > R + 15) continue;
      p.taken = true;
      if (p.kind === 'coin') sim.coinsRun++;
      if (p.kind === 'shield') sim.shield = true;
      if (p.kind === 'magnet') sim.magnetT = 12;
      if (p.kind === 'slow') sim.slowT = 6;
      if (p.kind === 'double') sim.doubleT = 12;
      sim.events.push({ type: 'pickup', kind: p.kind, x: p.x, y: p.y });
    }
  }

  function step(dt) {
    const b = sim.ball;
    b.flapT += dt;
    b.rot += b.vx * dt / R * .35;

    if (sim.over) {
      b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 1 - 1.4 * dt;
      if (b.y + R > GROUND) { b.y = GROUND - R; b.vy = Math.abs(b.vy) > 60 ? -b.vy * .55 : 0; }
      if (b.y - R < sim.top) { b.y = sim.top + R; b.vy = Math.abs(b.vy) * .4; }
      return;
    }

    sim.guardT = Math.max(0, sim.guardT - dt);
    sim.magnetT = Math.max(0, sim.magnetT - dt);
    sim.slowT = Math.max(0, sim.slowT - dt);
    sim.doubleT = Math.max(0, sim.doubleT - dt);

    fill();
    const target = speedAt(sim.made);
    b.vx += (target - b.vx) * Math.min(1, 3 * dt);
    b.vy = Math.min(MAXFALL, b.vy + G * dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    for (const h of sim.hoops) {
      if (h.amp) h.phase += h.w * dt;
      if (h.amp) h.y = h.base + h.amp * Math.sin(h.phase);
      h.hitT = Math.max(0, h.hitT - dt);
      if (Math.abs(h.x - b.x) > 140) continue;
      for (const [rx, ry] of rimPoints(h)) {
        const dx = b.x - rx, dy = b.y - ry, dist = Math.hypot(dx, dy), min = R + RIM;
        if (dist >= min || dist === 0) continue;
        const nx = dx / dist, ny = dy / dist;
        b.x = rx + nx * min; b.y = ry + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn >= 0) continue;
        b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny;
        const first = !h.scored && !h.touched;
        if (first) { h.touched = true; sim.bricks++; sim.streak = 0; }
        if (h.hitT === 0 && Math.abs(vn) > 40) {
          h.hitT = .08;
          sim.events.push({ type: 'rim', x: rx, y: ry, first, hoop: h });
        }
      }
    }

    collect();

    const h = next();
    const c = Math.cos(h.tilt), n = Math.sin(h.tilt);
    const rx = b.x - h.x, ry = b.y - h.y;
    const along = rx * c + ry * n, depth = -rx * n + ry * c;
    if (h.sPrev !== null && Math.abs(along) < h.rw) {
      if (h.sPrev < 0 && depth >= 0) {
        h.scored = true; sim.made++;
        h.swish = !h.touched && !h.reversed;
        let pts = 1;
        if (h.swish) {
          sim.streak++; sim.swishes++;
          sim.bestStreak = Math.max(sim.bestStreak, sim.streak);
          pts = Math.min(sim.streak + 1, 8);
        } else sim.streak = 0;
        if (h.gold) { pts += 3; sim.gold++; sim.coinsRun += 3; }
        if (sim.doubleT > 0) pts *= 2;
        sim.score += pts;
        sim.events.push({ type: 'score', x: h.x, y: h.y, pts, swish: h.swish, streak: sim.streak, gold: h.gold, hoop: h });
      } else if (h.sPrev > 0 && depth <= 0) h.reversed = true;
    }
    h.sPrev = depth;

    if (!h.scored && b.x - R > h.x + h.rw * c + 4) return die('airball');
    if (b.y + R >= GROUND) {
      if (sim.guardT > 0 || opts.zen) return bump('floor');
      return die('floor');
    }
    if (b.y - R <= sim.top) {
      if (sim.guardT > 0 || opts.zen) return bump('roof');
      return die('roof');
    }
  }

  function bump(where) {
    const b = sim.ball;
    if (where === 'floor') { b.y = GROUND - R - 1; b.vy = -480; }
    else { b.y = sim.top + R + 1; b.vy = 160; }
    sim.events.push({ type: 'bump', where, x: b.x, y: b.y });
  }

  function die(reason) {
    sim.misses++;
    if (opts.zen) {
      sim.streak = 0;
      if (reason === 'airball') skip(next());
      return;
    }
    if (opts.saves && (sim.shield || sim.follower)) {
      const by = sim.shield ? 'shield' : 'heart';
      if (by === 'shield') sim.shield = false; else sim.follower = false;
      sim.guardT = by === 'shield' ? 10 : 3;
      sim.streak = 0;
      if (reason === 'airball') { skip(next()); sim.ball.vy = -300; }
      else bump(reason);
      sim.events.push({ type: 'saved', by, x: sim.ball.x, y: sim.ball.y });
      return;
    }
    sim.over = reason;
    sim.events.push({ type: 'over', reason });
  }

  fill();
  return sim;
}

  ['Lemon', '#f2d21a', '#574a00', '#fffbd1'], ['Slate', '#5b6b7c', '#1c242c', '#dfe6ec'], ['Mint', '#3fcfa4', '#0d4434', '#d9fff2'], ['Coral', '#ff7f6b', '#5a1f15', '#ffe3dc'], ['Sky', '#62bdf0', '#123e57', '#e6f7ff'],

  { name: 'Beach Court', rarity: 'common', price: 300, bands: ['#1aa6c9', '#2fb8d1', '#56c9d6', '#8cdad8', '#c0e8d4', '#f7e7b5'], sun: '#fff0a0', city: '#128a9e', lit: '#f7e7b5', fence: 'rgba(120,80,30,.4)', post: '#7a5a2a', ground: '#e0c489', edge: '#efd9a5', line: '#ffffff' },

/* Each category sells 80 items for coins. Item 0 is free, and the other 219 unlock at rising best scores, easiest rarity first. */
const BUY_SLOTS = [8, 8, 8, 8, 8, 6, 6, 6, 6, 5, 5, 6];
const isBuyable = i => (7 * (i % 25) + 3 * Math.floor(i / 25) + 17) % 25 < BUY_SLOTS[Math.floor(i / 25)];
const SCORE_REQ = (() => {
  const out = {}, ids = [];
  for (let i = 1; i < 300; i++) if (!isBuyable(i)) ids.push(i);
  ids.forEach((id, k) => { out[id] = 5 + k + Math.round(277 * Math.pow(k / (ids.length - 1), 3)); });
  return out;
})();
const SCORE_STEPS = Object.values(SCORE_REQ).sort((a, b) => a - b);

function catalogItem(cat, i) {
  if (cat === 'court') {
    const c = COURTS[i];
    return { cat, i, name: c.name, rarity: c.rarity, price: c.price, data: c };
  }
  const styleI = Math.floor(i / 25), pal = PALETTES[i % 25], style = STYLE_NAMES[cat][styleI], rarity = STYLE_TIERS[styleI];
  const item = { cat, i, name: `${pal[0]} ${style}`, style, pal: pal.slice(1), rarity };
  if (i === 0) item.price = 0;
  else if (isBuyable(i)) item.price = RARITY[rarity].price;
  else item.scoreReq = SCORE_REQ[i];
  return item;
}
const catSize = cat => cat === 'court' ? COURTS.length : 300;

  g.beginPath();

  }

}

  g.bezierCurveTo(r * .7, -r * 1.1, r * 1.4, -r * .1, 0, r * .9);
  g.closePath();
}
function drawShape(g, shape, r, rot) {

    case 'ring': g.lineWidth = Math.max(1.2, r * .3); g.strokeStyle = g.fillStyle; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke(); break;
    case 'square': g.fillRect(-r, -r, r * 2, r * 2); break;

    case 'star': starPath(g, r); g.fill(); break;
    case 'heart': heartPath(g, r); g.fill(); break;
    case 'bolt': g.lineWidth = 2.2; g.strokeStyle = g.fillStyle; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-r, -r); g.lineTo(r * .1, -r * .15); g.lineTo(-r * .2, r * .15); g.lineTo(r, r); g.stroke(); break;

}

/* ---------- ball skins ---------- */

  g.restore();

}

}
const WING_DRAW = {

  Leaf: (g, L, a, b, c) => {

  Paper: (g, L, a, b, c) => {

    g.fillStyle = a; g.beginPath(); g.moveTo(0, 0); g.lineTo(L, -L * .1); g.lineTo(L * .4, L * .2); g.closePath(); g.fill(); g.stroke();
  },
  Fin: (g, L, a, b, c) => {

    g.fillStyle = c; g.beginPath(); g.moveTo(L * .3, -L * .12); g.lineTo(L * .72, -L * .22); g.lineTo(L * .58, -L * .02); g.lineTo(L * .28, L * .01); g.closePath(); g.fill();
  },
  Bat: (g, L, a, b, c) => {
    g.fillStyle = a; g.beginPath(); g.moveTo(0, -L * .08); g.lineTo(L * .5, -L * .36); g.lineTo(L, -L * .16);
    g.quadraticCurveTo(L * .8, -L * .1, L * .72, L * .14); g.quadraticCurveTo(L * .55, L * .02, L * .42, L * .24); g.quadraticCurveTo(L * .26, L * .08, 0, L * .2); g.closePath(); g.fill(); g.stroke();

    g.fillStyle = c; g.beginPath(); g.ellipse(L * .36, L * .2, L * .3, L * .2, .55, 0, TAU); g.fill(); g.stroke();

/* ---------- swoosh flames ---------- */
const FLAME = {
  Flame: { shape: 'circle', size: [4, 10], vx: [-40, 0], vy: [-150, -60], life: [.28, .5], n: 2 },
  Smoke: { shape: 'circle', size: [8, 14], vx: [-30, 0], vy: [-50, -15], life: [.55, .9], n: 1, alpha: .55 },
  Sparks: { shape: 'circle', size: [1.5, 3], vx: [-130, 40], vy: [-130, 110], life: [.25, .45], n: 3 },
  Bubbles: { shape: 'ring', size: [3, 8], vx: [-30, 10], vy: [-90, -40], life: [.5, .8], n: 1 },
  Pixels: { shape: 'square', size: [2.5, 5.5], vx: [-40, 0], vy: [-60, 20], life: [.35, .55], n: 2 },
  Snowfall: { shape: 'circle', size: [2, 4], vx: [-30, 10], vy: [20, 70], life: [.6, .95], n: 2 },
  Stars: { shape: 'star', size: [4, 8], vx: [-50, 0], vy: [-70, 30], life: [.4, .65], n: 1, spin: 5 },
  Hearts: { shape: 'heart', size: [4, 7], vx: [-40, 0], vy: [-90, -30], life: [.45, .7], n: 1 },
  Confetti: { shape: 'rect', size: [3, 5], vx: [-70, 20], vy: [-70, 60], life: [.45, .75], n: 2, spin: 12 },
  Bolts: { shape: 'bolt', size: [6, 11], vx: [-60, 0], vy: [-40, 40], life: [.14, .28], n: 1 },
  Comet: { shape: 'circle', size: [8, 14], vx: [-14, 0], vy: [-8, 8], life: [.25, .4], n: 3, alpha: .8 },
  Aurora: { shape: 'circle', size: [10, 18], vx: [-30, 0], vy: [-40, 40], life: [.5, .85], n: 2, alpha: .38, tri: true }
};
const between = ([a, b]) => a + Math.random() * (b - a);
function emitTrail(list, x, y, it, power) {
  const F = FLAME[it.style] || FLAME.Flame;
  const [a, b, c] = it.pal, colors = F.tri ? [a, c, '#ff4fd8', '#5ad1e8'] : F === FLAME.Smoke ? [a, c] : [a, c];
  for (let i = 0; i < F.n; i++) {
    if (Math.random() > power) continue;
    list.push({
      x: x - 8 + (Math.random() - .5) * 16, y: y + (Math.random() - .5) * 18,
      vx: between(F.vx), vy: between(F.vy), life: between(F.life), t: 0, r: between(F.size),
      col: colors[Math.floor(Math.random() * colors.length)], g: 0, shape: F.shape, rot: Math.random() * TAU, spin: F.spin || 0, alpha: F.alpha || 1, shrink: true

  }
}
function drawParts(g, list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.spin) p.rot += p.spin * dt;
    if (p.t >= p.life) { list.splice(i, 1); continue; }
    const k = 1 - p.t / p.life;
    g.globalAlpha = k * (p.alpha || 1);
    g.fillStyle = p.col;
    g.save();
    g.translate(p.x, p.y);
    drawShape(g, p.shape || 'circle', p.shrink ? p.r * (.45 + .55 * k) : p.r, p.rot || 0);
    g.restore();
  }
  g.globalAlpha = 1;

/* ---------- hoops ---------- */
function drawNet(h, front, alpha) {
  const N = 6, L = 3, rx = h.rw, ry = h.rw * .3;
  const kick = h.kick, height = 46 * (1 + .3 * kick * Math.sin(clock * 26));
  const sway = v => Math.sin(clock * 22 + h.n) * kick * 6 * v;
  const pt = (i, j) => {
    const v = j / L, th = (front ? 0 : Math.PI) + Math.PI * i / N, w = 1 - .38 * v;
    return [Math.cos(th) * rx * w + sway(v), Math.sin(th) * ry * w + v * height];
  };
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = C.cream; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let j = 0; j < L; j++) for (let i = 0; i < N; i++) {
    let p = pt(i, j), q = pt(i + 1, j + 1);
    ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    p = pt(i + 1, j); q = pt(i, j + 1);
    ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function rimColor(h) {
  if (h.skipped) return '#6b7b80';

}

  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.tilt);
  drawNet(h, false, .45);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, h.rw, h.rw * .3, 0, Math.PI, TAU); ctx.stroke();
  ctx.strokeStyle = h.scored || h.gold ? rimColor(h) : '#a61e2c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(0, 0, h.rw, h.rw * .3, 0, Math.PI, TAU); ctx.stroke();
  ctx.restore();
}
function hoopFront(h) {
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.tilt);
  drawNet(h, true, .95);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, h.rw, h.rw * .3, 0, 0, Math.PI); ctx.stroke();
  ctx.strokeStyle = rimColor(h); ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(0, 0, h.rw, h.rw * .3, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
}
function chevron(h) {
  const y = h.y - 44 + Math.sin(clock * 6) * 5;
  ctx.fillStyle = C.cream; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(h.x - 15, y - 14); ctx.lineTo(h.x, y - 3); ctx.lineTo(h.x + 15, y - 14);
  ctx.lineTo(h.x + 15, y - 5); ctx.lineTo(h.x, y + 8); ctx.lineTo(h.x - 15, y - 5); ctx.closePath();
  ctx.stroke(); ctx.fill();
}

/* ---------- pickups ---------- */
function shieldPath(g, r) {
  g.beginPath();
  g.moveTo(0, -r); g.lineTo(r * .85, -r * .62); g.quadraticCurveTo(r * .85, r * .55, 0, r);
  g.quadraticCurveTo(-r * .85, r * .55, -r * .85, -r * .62); g.closePath();
}
function drawPickupIcon(g, kind, r) {
  g.lineJoin = 'round'; g.lineCap = 'round';

    g.fillStyle = C.mustard; g.strokeStyle = C.ink; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#a87800'; g.lineWidth = 1.6; g.beginPath(); g.arc(0, 0, r * .6, 0, TAU); g.stroke();
    return;
  }
  const badge = { shield: '#0d5f73', heart: '#6e1226', magnet: '#3a2a6e', slow: '#14595c', double: '#7a3a08' }[kind];
  g.fillStyle = badge; g.strokeStyle = C.cream; g.lineWidth = 2.4;
  g.beginPath(); g.arc(0, 0, r * 1.25, 0, TAU); g.fill(); g.stroke();
  if (kind === 'shield') { g.fillStyle = C.cyan; shieldPath(g, r * .8); g.fill(); }
  if (kind === 'heart') { g.fillStyle = '#ff5a76'; heartPath(g, r * .72); g.fill(); }
  if (kind === 'magnet') {
    g.strokeStyle = '#ff5a76'; g.lineWidth = r * .36; g.lineCap = 'butt';
    g.beginPath(); g.arc(0, -r * .1, r * .48, Math.PI, 0); g.lineTo(r * .48, r * .55); g.moveTo(-r * .48, -r * .1); g.lineTo(-r * .48, r * .55); g.stroke();
  }
  if (kind === 'slow') {
    g.strokeStyle = C.cream; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, 0, r * .7, 0, TAU); g.moveTo(0, 0); g.lineTo(0, -r * .5); g.moveTo(0, 0); g.lineTo(r * .36, r * .12); g.stroke();
  }
  if (kind === 'double') {
    g.fillStyle = C.mustard; g.font = `${r * 1.1}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('2X', 0, r * .06); g.textBaseline = 'alphabetic';
  }
}

/* ---------- effects ---------- */
function burst(x, y, n, colors, power) {
  if (reduced) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = power * (.35 + Math.random() * .75);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * .3, life: .4 + Math.random() * .4, t: 0, r: 2 + Math.random() * 2.5, col: colors[i % colors.length], g: 700 });
  }
}

}

    if (e.type === 'score') {

        if (e.swish) track('swishes', 1);

function frame(now) {

const OVER_TEXT = { airball: 'Air ball', floor: 'Out of bounds', roof: 'Hit the roof' };

    status.textContent = 'Saved. Check your downloads folder.';
  };
  const other = el('button', { class: packs.length ? 'ghost' : 'cta', type: 'button', id: 'dlPage', text: packs.length ? 'Download the web page' : 'Download for another device', onclick: () => offer('wingball.html', page) });
  const appBlock = ({ id, app, zip }, main) => [
    el('h3', { text: main ? `Wingball for ${app.name}` : `On ${app.name}` }),
    el('p', { text: `Get Wingball as ${app.name === 'Android' ? 'an' : 'a'} ${app.name} app, a ${kb(zip)} KB download.` }),
    el('ol', { class: 'dlSteps' }, ...app.steps.map(text => el('li', { text }))),
    el('button', { class: main ? 'cta' : 'ghost', type: 'button', id: `dl-${id}`, text: `Download for ${app.name}`, onclick: () => offer(app.file, zip) }),
    el('p', { class: 'muted', text: `${app.warn} ${app.needs}` })
  ];
  if (packs.length) {
    const iphone = kind === 'iphone';
    if (iphone) box.append(el('p', { text: 'iPhones and iPads can only install apps from the App Store, and Wingball isn’t on it, so there’s no app for this device. Play here on this page instead: your progress saves to your account.' }));
    packs.forEach((p, i) => box.append(...appBlock(p, !iphone && i === 0 && kind !== 'other')));
    box.append(status, copy,
      el('h3', { text: 'How the apps differ' }),
      el('p', { text: 'They start a fresh save, so your coins and skins here don’t carry over. They have a practice leaderboard with computer players instead of the shared board. Without internet they still play, using simpler fonts.' }),
      el('h3', { text: 'On a Mac' }),
      el('p', { text: `Get the game as a ${kb(page)} KB web page and open it in your browser.` }),
      other);
  } else {
    box.append(
      el('p', { text: `To keep a copy or play on another device, get the game as a ${kb(page)} KB web page and open it in a browser. It starts a fresh save.` }),
      other, status, copy);
  }
}

/* ---------- admin ---------- */
function adminTouch() { store.adminUsed = true; }
function renderAdmin() {
  const box = inner();
  box.textContent = '';
  const after = msg => { save(true); postScore(); syncPanelCoins(); toast(msg); renderAdmin(); };
  const coinInput = el('input', { id: 'adminCoins', type: 'number', min: 0, inputmode: 'numeric', value: 1000 });
  const bestInput = el('input', { id: 'adminBest', type: 'number', min: 0, inputmode: 'numeric', value: store.best });
  const counts = Object.keys(CAT_LABEL).map(c => `${ownedCount(c)}/${catSize(c)} ${CAT_LABEL[c].toLowerCase()}`).join(', ');
  box.append(el('p', { class: 'muted', text: 'Coin and high score changes show an ADMIN tag next to your name on the leaderboard.' }));
  box.append(el('h3', { text: 'Skins' }), el('p', { text: `You own ${counts}.` }),
    el('div', { class: 'row' },
      el('button', { class: 'cta', type: 'button', id: 'adminAll', text: 'Give all skins', onclick: () => {
        for (const c of Object.keys(CAT_LABEL)) for (let i = 0; i < catSize(c); i++) grant(c, i);
        after('All skins unlocked.');
      } })));
  box.append(el('h3', { text: 'Coins' }), el('p', { text: `You have ${fmt(store.coins)} coins.` }),
    el('div', { class: 'formRow' }, el('label', { class: 'field', text: 'Coins to give' }, coinInput),
      el('button', { class: 'ghost', type: 'button', id: 'adminGive', text: 'Give coins', onclick: () => {
        const n = Math.floor(Number(coinInput.value));
        if (!(n > 0) || n > 1e9) { toast('Enter a number from 1 to 1,000,000,000.'); return; }
        addCoins(n); adminTouch(); after(`Gave ${fmt(n)} coins.`);
      } })));
  box.append(el('h3', { text: 'High score' }),
    el('div', { class: 'formRow' }, el('label', { class: 'field', text: 'New high score' }, bestInput),
      el('button', { class: 'ghost', type: 'button', id: 'adminSetBest', text: 'Set high score', onclick: () => {
        const n = Math.floor(Number(bestInput.value));
        if (!(n >= 0) || n > 1e9 || bestInput.value === '') { toast('Enter a number from 0 to 1,000,000,000.'); return; }
        store.best = n; adminTouch(); fixEquip(); after(`High score set to ${fmt(n)}.`);
      } })));
  box.append(el('h3', { text: 'Run tools' }),
    el('div', { class: 'row' },
      el('button', { class: 'ghost', type: 'button', text: 'Give heart buddy', onclick: () => { store.follower = true; after('A heart follows you on your next run.'); } }),
      el('button', { class: 'ghost', type: 'button', text: 'Start next run with shield', onclick: () => { store.startShield = true; after('Your next run starts with a shield.'); } }),
      el('button', { class: 'ghost', type: 'button', text: 'Finish today’s challenges', onclick: () => {
        const d = dailyState();
        for (const q of dailyPick(d.date)) d.prog[q.metric] = Math.max(d.prog[q.metric] || 0, q.goal);
        after('Today’s challenges are ready to claim.');
      } }),
      el('button', { class: 'ghost', type: 'button', 'aria-pressed': String(adminGod), text: adminGod ? 'No-death mode: on' : 'No-death mode: off', onclick: () => { adminGod = !adminGod; toast(adminGod ? 'No-death runs record nothing.' : 'No-death mode off.'); renderAdmin(); } })));
  const erase = el('button', { class: 'ghost', type: 'button', text: 'Erase my save', onclick: () => {
    if (erase.dataset.armed) {
      const nick = store.nick;
      store = blankSave(); store.nick = nick; ownedSets = null;
      after('Save erased.');
    } else { erase.dataset.armed = '1'; erase.textContent = 'Tap again to erase everything'; }
  } });
  box.append(el('h3', { text: 'Danger' }), erase);
}

function openCodePrompt() {
  $('codeError').textContent = '';
  $('codeInput').value = '';
  $('codeModal').hidden = false;
  $('codeInput').focus();
}
function closeCodePrompt() { $('codeModal').hidden = true; }
$('codeForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('codeInput').value.trim() === '6767') {
    closeCodePrompt();
    Sound.play('power');
    openPanel('admin');
  } else {
    $('codeError').textContent = 'Wrong code. Try again.';
    $('codeInput').select();
  }
});
$('codeCancel').addEventListener('click', closeCodePrompt);

/* Holding the sound button for 4 seconds opens the code prompt; a short press toggles sound. */
const HOLD_MS = 4000;
const hold = { active: false, start: 0, raf: 0, fired: false };
function holdTick() {
  if (!hold.active) return;
  const p = Math.min(1, (performance.now() - hold.start) / HOLD_MS);
  const ring = $('holdRing');
  ring.style.opacity = p > .08 ? 1 : 0;
  ring.style.setProperty('--p', p);
  hold.raf = requestAnimationFrame(holdTick);
}
function beginHold() {
  if (hold.active) return;
  hold.active = true; hold.fired = false; hold.start = performance.now();
  if (mode !== 'title' && mode !== 'gameover') return;
  hold.raf = requestAnimationFrame(holdTick);
  hold.timer = setTimeout(() => { hold.fired = true; endHold(); openCodePrompt(); }, HOLD_MS);
}
function endHold() {
  hold.active = false;
  cancelAnimationFrame(hold.raf);
  clearTimeout(hold.timer);
  $('holdRing').style.opacity = 0;
}
function toggleSound() {
  store.sound = !store.sound;
  save(true);
  syncMute();
  Sound.wake();
  Sound.syncMusic();
}
const muteBtn = $('muteBtn');
muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { muteBtn.setPointerCapture(e.pointerId); } catch (x) {} beginHold(); });
muteBtn.addEventListener('pointerup', () => { const was = hold.active; endHold(); if (was) toggleSound(); });
muteBtn.addEventListener('pointercancel', endHold);
muteBtn.addEventListener('contextmenu', e => e.preventDefault());
muteBtn.addEventListener('keydown', e => {
  if (e.code !== 'Enter' && e.code !== 'Space') return;
  e.preventDefault(); e.stopPropagation();
  if (!e.repeat) beginHold();
});
muteBtn.addEventListener('keyup', e => {
  if (e.code !== 'Enter' && e.code !== 'Space') return;
  e.preventDefault();
  const was = hold.active; endHold(); if (was) toggleSound();
});
muteBtn.addEventListener('click', e => { if (e.detail === 0) toggleSound(); });

function syncMute() {
  muteBtn.setAttribute('aria-pressed', String(!store.sound));
  muteBtn.setAttribute('aria-label', store.sound ? 'Sound on. Press to mute.' : 'Sound off. Press to turn on.');
  $('muteWaves').style.display = store.sound ? '' : 'none';
  muteBtn.style.opacity = store.sound ? '1' : '.7';
}

/* ---------- input ---------- */
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .plate, .panel, .modalWrap, input, select')) { Sound.wake(); return; }
  e.preventDefault();
  if (panel) return;
  press();
});
addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, select, textarea')) return;
  if (!$('codeModal').hidden) { if (e.code === 'Escape') closeCodePrompt(); return; }
  if (panel) { if (e.code === 'Escape') closePanel(); return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') pause(); else if (mode === 'paused') resume(); return; }
  if (!['Space', 'ArrowUp', 'KeyW'].includes(e.code)) return;
  if (e.target.closest && e.target.closest('button') && e.code === 'Space') return;
  e.preventDefault();
  if (e.repeat) return;
  if (mode === 'gameover') { Sound.wake(); getReady(); return; }
  if (mode === 'over' || mode === 'revive') return;
  press();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); saveOnLeave(); } Sound.syncMusic(); });
addEventListener('pagehide', saveOnLeave);
setInterval(() => { if (run && !run.ended) { bankRun(); save(true); postScore(); } }, 20000);

document.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', e => { Sound.wake(); Sound.play('click'); openPanel(b.dataset.panel); if (e.detail > 0) b.blur(); }));
$('panelBack').addEventListener('click', closePanel);
$('playBtn').addEventListener('click', () => { Sound.wake(); getReady(); tipOff(); });
$('againBtn').addEventListener('click', () => { Sound.wake(); getReady(); });
$('overMenu').addEventListener('click', toMenu);
$('resumeBtn').addEventListener('click', () => { Sound.wake(); resume(); });
$('quitBtn').addEventListener('click', () => { $('pauseScreen').hidden = true; if (run.ended) toMenu(); else finishRun(); });
$('pauseBtn').addEventListener('click', e => { pause(); if (e.detail > 0) e.currentTarget.blur(); });
$('reviveBtn').addEventListener('click', doRevive);
$('reviveSkip').addEventListener('click', () => { $('reviveScreen').hidden = true; finishRun(); });

syncMute();
dailyState();
markBoot();
refreshMenu();
updateHud();
connectCloud().then(() => {
  settleLeftRun();
  loginReward();
  refreshMenu();
  updateHud();
  if (!Cloud.ready && !canStore()) toast('This browser is blocking saves, so your progress will be lost when you close the game.');
});
requestAnimationFrame(t => { last = t; frame(t); });
</script></body></html>
